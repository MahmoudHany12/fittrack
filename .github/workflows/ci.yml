name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  api:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('api/Cargo.toml') != '' }}
    defaults: { run: { working-directory: api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fittrack, POSTGRES_PASSWORD: ci, POSTGRES_DB: fittrack }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fittrack" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://fittrack:ci@localhost:5432/fittrack
      SQLX_OFFLINE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: api }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
  mobile:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('mobile/package.json') != '' }}
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
  ci-ok:
    if: always()
    needs: [api, mobile]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "api=${{ needs.api.result }} mobile=${{ needs.mobile.result }}"
          [ "${{ needs.api.result }}" != "failure" ] && [ "${{ needs.mobile.result }}" != "failure" ]
