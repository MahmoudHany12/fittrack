services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-fittrack}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fittrack}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      BIND_ADDR: 0.0.0.0:8080
      FEATURES: ${FEATURES:-}
      USDA_API_KEY: ${USDA_API_KEY:-}
    ports:
      - "8080:8080"

  # Daily backup into ./backups. Set AGE_RECIPIENT (an age public key) in .env to encrypt
  # dumps; keep the private key offline. Restore: scripts/restore.sh <dump> <db>.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-fittrack}
      AGE_RECIPIENT: ${AGE_RECIPIENT:-}
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    entrypoint:
      - /bin/bash
      - -c
      - "if [ -n \"$$AGE_RECIPIENT\" ]; then apt-get update -qq && apt-get install -y -qq age >/dev/null; fi; while true; do bash /scripts/backup.sh || echo backup failed; sleep 86400; done"

volumes:
  dbdata:
